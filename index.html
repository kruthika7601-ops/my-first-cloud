
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCloudLab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f0f5ff;
      color: #172554;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 36px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #17255415;
      text-align: center;
    }

    .cloud {
      font-size: 52px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 36px;
    }

    p {
      color: #52627c;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 16px;
      padding: 13px 22px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .messages {
      margin-top: 28px;
      text-align: left;
    }

    .messages h2 {
      font-size: 21px;
      text-align: center;
    }

    .message-item {
      background: #f0f5ff;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .message-date {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="cloud">☁️</div>

    <h1>MyCloudLab</h1>

    <p>Welcome to MyCloudLab!</p>

    <p>
      Send messages, store them in the cloud,
      and retrieve them whenever you want.
    </p>

    <form id="messageForm">

      <input
        type="text"
        id="messageInput"
        placeholder="Enter your message..."
        maxlength="1000"
        required
      >

      <button type="submit" id="sendButton">
        Save Message
      </button>

    </form>

    <p id="status" aria-live="polite">
      Connecting to cloud database...
    </p>

    <section class="messages">

      <h2>☁️ Saved Cloud Messages</h2>

      <div id="messageList">
        Loading messages...
      </div>

      <button id="refreshButton" type="button">
        Refresh Messages
      </button>

    </section>

  </main>

  <script>

    // SUPABASE CONFIGURATION

    const SUPABASE_URL =
      "https://gpirhvzvfyllpiksarvn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_pAwNjS50OJzs808Sj42XXA_FV_yWC6s";

    const TABLE_NAME = "my-first-cloud";


    // HTML ELEMENTS

    const form = document.getElementById("messageForm");

    const input = document.getElementById("messageInput");

    const status = document.getElementById("status");

    const messageList = document.getElementById("messageList");

    const sendButton = document.getElementById("sendButton");

    const refreshButton = document.getElementById("refreshButton");


    // SUPABASE REST API

    const API_URL =
      `${SUPABASE_URL}/rest/v1/${TABLE_NAME}`;

    const headers = {
      "apikey": SUPABASE_PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    };


    // CHECK CONFIGURATION

    if (
      SUPABASE_PUBLISHABLE_KEY ===
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
    ) {
      status.textContent =
        "Please add your Supabase publishable key.";

      sendButton.disabled = true;
    } else {

      loadMessages();

    }


    // SAVE MESSAGE TO SUPABASE

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const message = input.value.trim();

      if (!message) {
        status.textContent = "Please enter a message.";
        return;
      }

      sendButton.disabled = true;

      status.textContent = "Saving message to cloud...";

      try {

        const response = await fetch(API_URL, {

          method: "POST",

          headers: {
            ...headers,
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            message: message
          })

        });

        if (!response.ok) {
          const error = await response.text();
          throw new Error(error);
        }

        input.value = "";

        status.textContent =
          "Success! Message saved to Supabase.";

        await loadMessages();

      } catch(error) {

        console.error("Save error:", error);

        status.textContent =
          "Failed to save: " + error.message;

      } finally {

        sendButton.disabled = false;

      }

    });


    // LOAD MESSAGES FROM SUPABASE

    async function loadMessages() {

      messageList.textContent = "Loading messages...";

      try {

        const response = await fetch(
          API_URL +
          "?select=id,message,created_at&order=created_at.desc",
          {
            method: "GET",
            headers: headers
          }
        );

        if (!response.ok) {
          const error = await response.text();
          throw new Error(error);
        }

        const messages = await response.json();

        displayMessages(messages);

        status.textContent =
          "Connected! Cloud database is working.";

      } catch(error) {

        console.error("Loading error:", error);

        messageList.textContent =
          "Unable to load messages.";

        status.textContent =
          "Database error: " + error.message;

      }

    }


    // DISPLAY SAVED MESSAGES

    function displayMessages(messages) {

      messageList.replaceChildren();

      if (messages.length === 0) {

        messageList.textContent =
          "No messages yet. Save your first message!";

        return;

      }

      messages.forEach(function(item) {

        const container = document.createElement("div");

        container.className = "message-item";

        const messageText = document.createElement("strong");

        messageText.textContent = item.message;

        const date = document.createElement("span");

        date.className = "message-date";

        date.textContent =
          new Date(item.created_at).toLocaleString();

        container.appendChild(messageText);

        container.appendChild(date);

        messageList.appendChild(container);

      });

    }


    // REFRESH BUTTON

    refreshButton.addEventListener("click", function() {

      loadMessages();

    });

  </script>

</body>
</html>
